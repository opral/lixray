services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lixray
      MINIO_ROOT_PASSWORD: lixray-local-secret
    ports:
      - "127.0.0.1:${LIXRAY_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${LIXRAY_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 lixray lixray-local-secret; do sleep 1; done
        mc mb --ignore-existing local/lixray

  lix-server:
    # Give graceful shutdown room to drain and close workspace stores; a
    # 10s SIGKILL mid-write leaves store state whose next open hangs.
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: lix-server/Dockerfile
      args:
        LIXRAY_IMAGE_VARIANT: perf
    environment:
      BIND_ADDR: 0.0.0.0:8080
      LIXRAY_MAX_OPEN_LIXS: 4
      LIXRAY_MAX_SESSIONS_PER_LIX: ${LIXRAY_MAX_SESSIONS_PER_LIX:-256}
      LIXRAY_INTERNAL_TOKEN: ${LIXRAY_INTERNAL_TOKEN:-lixray-local-internal-token}
      RUST_LOG: lixray=info
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lixray
      S3_ACCESS_KEY_ID: lixray
      S3_SECRET_ACCESS_KEY: lixray-local-secret
      S3_REGION: us-east-1
      S3_PREFIX: local
      S3_ALLOW_HTTP: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${LIXRAY_SERVER_PORT:-8080}:8080"

  lixray-web:
    build:
      context: .
      dockerfile: web-app/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:54321}
        VITE_SUPABASE_KEY: ${VITE_SUPABASE_KEY:-}
        VITE_LIXRAY_LOCAL_DEV: ${VITE_LIXRAY_LOCAL_DEV:-}
        VITE_LIXRAY_LOCAL_DEV_EMAIL: ${VITE_LIXRAY_LOCAL_DEV_EMAIL:-}
        VITE_LIXRAY_LOCAL_DEV_PASSWORD: ${VITE_LIXRAY_LOCAL_DEV_PASSWORD:-}
    environment:
      PORT: 8080
      LIXRAY_LIX_SERVICE_URL: http://lix-server:8080
      LIXRAY_INTERNAL_TOKEN: ${LIXRAY_INTERNAL_TOKEN:-lixray-local-internal-token}
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-http://host.docker.internal:54321/auth/v1/.well-known/jwks.json}
      SUPABASE_JWT_ISSUER_URL: ${SUPABASE_JWT_ISSUER_URL:-http://127.0.0.1:54321}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      lix-server:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${LIXRAY_DEV_PORT:-8787}:8080"

  storage-reset:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles:
      - tools
    depends_on:
      minio-init:
        condition: service_completed_successfully
    entrypoint: /bin/sh
    command:
      - -c
      - mc alias set local http://minio:9000 lixray lixray-local-secret && mc rm --recursive --force local/lixray/local/perf-slow-workspace

volumes:
  minio-data:
