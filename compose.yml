services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lixray
      MINIO_ROOT_PASSWORD: lixray-local-secret
    ports:
      - "127.0.0.1:${LIXRAY_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${LIXRAY_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 lixray lixray-local-secret; do sleep 1; done
        mc mb --ignore-existing local/lixray

  lix-server:
    # Give graceful shutdown room to drain and close repository stores; a
    # 10s SIGKILL mid-write leaves store state whose next open hangs.
    stop_grace_period: 30s
    # Lix builds this image once. LixRay only pulls the immutable artifact.
    # Set LIXRAY_SERVER_IMAGE to a locally built Lix image when developing the
    # server itself.
    image: ${LIXRAY_SERVER_IMAGE:-ghcr.io/opral/lix-server@sha256:f942d397e3a4e605243ab119643624bed9388915c0ad35103737887b4a17b708}
    environment:
      BIND_ADDR: 0.0.0.0:8080
      LIX_SERVER_PUBLIC_URL: ${LIXRAY_PUBLIC_URL:-http://127.0.0.1:8787}
      LIX_SERVER_MAX_OPEN_LIXS: ${LIXRAY_MAX_OPEN_LIXS:-32}
      LIX_SERVER_INTERNAL_TOKEN: ${LIXRAY_INTERNAL_TOKEN:-lixray-local-internal-token}
      LIX_SERVER_PROTOCOL_TIMEOUT_SECS: ${LIXRAY_PROTOCOL_TIMEOUT_SECS:-60}
      LIX_SERVER_RECOVERY_CLOSE_TIMEOUT_SECS: ${LIXRAY_RECOVERY_CLOSE_TIMEOUT_SECS:-30}
      RUST_LOG: ${RUST_LOG:-lix_server=info}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lixray
      S3_ACCESS_KEY_ID: lixray
      S3_SECRET_ACCESS_KEY: lixray-local-secret
      S3_REGION: us-east-1
      S3_PREFIX: ${LIXRAY_STORAGE_PREFIX:-local}
      S3_ALLOW_HTTP: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${LIXRAY_SERVER_PORT:-8080}:8080"

  lixray-web:
    build:
      context: .
      dockerfile: web-app/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:54321}
        VITE_SUPABASE_KEY: ${VITE_SUPABASE_KEY:-}
        VITE_LIXRAY_LOCAL_DEV: ${VITE_LIXRAY_LOCAL_DEV:-}
        VITE_LIXRAY_LOCAL_DEV_EMAIL: ${VITE_LIXRAY_LOCAL_DEV_EMAIL:-}
        VITE_LIXRAY_LOCAL_DEV_PASSWORD: ${VITE_LIXRAY_LOCAL_DEV_PASSWORD:-}
    environment:
      PORT: 8080
      LIXRAY_LIX_SERVICE_URL: http://lix-server:8080
      LIXRAY_INTERNAL_TOKEN: ${LIXRAY_INTERNAL_TOKEN:-lixray-local-internal-token}
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-http://host.docker.internal:54321/auth/v1/.well-known/jwks.json}
      SUPABASE_JWT_ISSUER_URL: ${SUPABASE_JWT_ISSUER_URL:-http://127.0.0.1:54321}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      lix-server:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${LIXRAY_DEV_PORT:-8787}:8080"

  storage-reset:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles:
      - tools
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      LIXRAY_PERF_REPOSITORY: ${LIXRAY_PERF_REPOSITORY:-}
    volumes:
      - ./scripts/validate-lix-uuid.sh:/usr/local/bin/validate-lix-uuid:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$${LIXRAY_PERF_REPOSITORY}" ]; then
          echo "LIXRAY_PERF_REPOSITORY is required" >&2
          exit 2
        fi
        /bin/sh /usr/local/bin/validate-lix-uuid "$${LIXRAY_PERF_REPOSITORY}"
        mc alias set local http://minio:9000 lixray lixray-local-secret
        mc rm --recursive --force "local/lixray/local/perf/$${LIXRAY_PERF_REPOSITORY}/"

  onboarding-storage-reset:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles:
      - tools
    depends_on:
      minio-init:
        condition: service_completed_successfully
    entrypoint: /bin/sh
    command:
      - -c
      - mc alias set local http://minio:9000 lixray lixray-local-secret && mc rm --recursive --force local/lixray/local

volumes:
  minio-data:
