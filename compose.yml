services:
  # The archived community image is no longer pullable from Quay. Pin a
  # source-built image (github.com/CloudPirates-io/image-minio) so local and
  # CI object storage remain reproducible.
  minio:
    image: cloudpirates/image-minio:RELEASE.2025-10-15T17-29-55Z-hardened@sha256:8dc02a7e509336c8bbb67962086d691bdcde20a2c9327ed68e5081a681f6dbfc
    entrypoint: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lixray
      MINIO_ROOT_PASSWORD: lixray-local-secret
    ports:
      - "127.0.0.1:${LIXRAY_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${LIXRAY_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: amazon/aws-cli:2.37.1@sha256:b0dd5a4d216a1786863541a201baa7b7b4c5032bec9c6e72c38d01cafd7e8db8
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: lixray
      AWS_SECRET_ACCESS_KEY: lixray-local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do sleep 1; done
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket lixray >/dev/null 2>&1 ||
          aws --endpoint-url http://minio:9000 s3api create-bucket --bucket lixray >/dev/null

  lix-server:
    # Give graceful shutdown room to drain and close repository stores; a
    # 10s SIGKILL mid-write leaves store state whose next open hangs.
    stop_grace_period: 30s
    # Lix builds this image once. LixRay only pulls the immutable artifact.
    # Set LIXRAY_SERVER_IMAGE to a locally built Lix image when developing the
    # server itself.
    image: ${LIXRAY_SERVER_IMAGE:-ghcr.io/opral/lixray-server@sha256:e6c61c3777219e2bd7f7c48737b766edf8443fac6ab958c0d54c5dbef7b1b3c0}
    environment:
      BIND_ADDR: 0.0.0.0:8080
      LIX_SERVER_PUBLIC_URL: ${LIXRAY_PUBLIC_URL:-http://127.0.0.1:8787}
      LIX_SERVER_MAX_OPEN_LIXS: ${LIXRAY_MAX_OPEN_LIXS:-32}
      LIX_SERVER_INTERNAL_TOKEN: ${LIXRAY_INTERNAL_TOKEN:-lixray-local-internal-token}
      LIX_SERVER_PROTOCOL_TIMEOUT_SECS: ${LIXRAY_PROTOCOL_TIMEOUT_SECS:-60}
      LIX_SERVER_RECOVERY_CLOSE_TIMEOUT_SECS: ${LIXRAY_RECOVERY_CLOSE_TIMEOUT_SECS:-30}
      RUST_LOG: ${RUST_LOG:-lix_server=info}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lixray
      S3_ACCESS_KEY_ID: lixray
      S3_SECRET_ACCESS_KEY: lixray-local-secret
      S3_REGION: us-east-1
      S3_PREFIX: ${LIXRAY_STORAGE_PREFIX:-local}
      S3_ALLOW_HTTP: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${LIXRAY_SERVER_PORT:-8080}:8080"

  lixray-web:
    build:
      context: .
      dockerfile: web-app/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:54321}
        VITE_SUPABASE_KEY: ${VITE_SUPABASE_KEY:-}
        VITE_LIXRAY_LOCAL_DEV: ${VITE_LIXRAY_LOCAL_DEV:-}
        VITE_LIXRAY_LOCAL_DEV_EMAIL: ${VITE_LIXRAY_LOCAL_DEV_EMAIL:-}
        VITE_LIXRAY_LOCAL_DEV_PASSWORD: ${VITE_LIXRAY_LOCAL_DEV_PASSWORD:-}
    environment:
      PORT: 8080
      LIXRAY_LIX_SERVICE_URL: http://lix-server:8080
      LIXRAY_INTERNAL_TOKEN: ${LIXRAY_INTERNAL_TOKEN:-lixray-local-internal-token}
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-http://host.docker.internal:54321/auth/v1/.well-known/jwks.json}
      SUPABASE_JWT_ISSUER_URL: ${SUPABASE_JWT_ISSUER_URL:-http://127.0.0.1:54321}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    depends_on:
      lix-server:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${LIXRAY_DEV_PORT:-8787}:8080"

  storage-reset:
    image: amazon/aws-cli:2.37.1@sha256:b0dd5a4d216a1786863541a201baa7b7b4c5032bec9c6e72c38d01cafd7e8db8
    profiles:
      - tools
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      LIXRAY_PERF_REPOSITORY: ${LIXRAY_PERF_REPOSITORY:-}
      AWS_ACCESS_KEY_ID: lixray
      AWS_SECRET_ACCESS_KEY: lixray-local-secret
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts/validate-lix-uuid.sh:/usr/local/bin/validate-lix-uuid:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$${LIXRAY_PERF_REPOSITORY}" ]; then
          echo "LIXRAY_PERF_REPOSITORY is required" >&2
          exit 2
        fi
        /bin/sh /usr/local/bin/validate-lix-uuid "$${LIXRAY_PERF_REPOSITORY}"
        aws --endpoint-url http://minio:9000 s3 rm "s3://lixray/local/perf/$${LIXRAY_PERF_REPOSITORY}/" --recursive

  onboarding-storage-reset:
    image: amazon/aws-cli:2.37.1@sha256:b0dd5a4d216a1786863541a201baa7b7b4c5032bec9c6e72c38d01cafd7e8db8
    profiles:
      - tools
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: lixray
      AWS_SECRET_ACCESS_KEY: lixray-local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - aws --endpoint-url http://minio:9000 s3 rm s3://lixray/local/ --recursive

volumes:
  minio-data:
