services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lixray
      MINIO_ROOT_PASSWORD: lixray-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 lixray lixray-local-secret; do sleep 1; done
        mc mb --ignore-existing local/lixray

  lix-server:
    build:
      context: .
      dockerfile: lix-server/Dockerfile
      args:
        LIXRAY_IMAGE_VARIANT: perf
    environment:
      BIND_ADDR: 0.0.0.0:8080
      LIXRAY_MAX_OPEN_WORKSPACES: 4
      RUST_LOG: lixray=info
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lixray
      S3_ACCESS_KEY_ID: lixray
      S3_SECRET_ACCESS_KEY: lixray-local-secret
      S3_REGION: us-east-1
      S3_PREFIX: local
      S3_ALLOW_HTTP: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"

  storage-reset:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles:
      - tools
    depends_on:
      minio-init:
        condition: service_completed_successfully
    entrypoint: /bin/sh
    command:
      - -c
      - mc alias set local http://minio:9000 lixray lixray-local-secret && mc rm --recursive --force local/lixray/local/perf-slow-workspace

volumes:
  minio-data:
