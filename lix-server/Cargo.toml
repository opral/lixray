[package]
name = "lixray"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
http = "1.4.0"
http-body = "1.0.1"
lix_sdk = { path = "../vendor/lix/packages/rs-sdk", default-features = false }
lix_server_protocol = { path = "../vendor/lix/packages/server-protocol" }
lix_slatedb_storage = { path = "../vendor/lix/packages/slatedb-storage" }
object_store = { version = "0.14.0", default-features = false, features = ["aws"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-client", "reqwest-rustls-webpki-roots", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.3"
