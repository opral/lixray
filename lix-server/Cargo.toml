[package]
name = "lixray"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
axum = "0.8.9"
futures-core = "0.3.32"
http = "1.4.0"
lix_backends = { git = "https://github.com/opral/lix.git", branch = "main", package = "lix_backends", features = ["slatedb"] }
lix_engine = { git = "https://github.com/opral/lix.git", branch = "main", package = "lix_engine" }
object_store = { version = "0.14.0", default-features = false, features = ["aws"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
