[package]
name = "lixray"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
blake3 = "1.8.2"
bytes = "1.10.1"
fs2 = "0.4.3"
futures-util = "0.3.31"
http = "1.4.0"
http-body = "1.0.1"
lix_sdk = { package = "lix", path = "../vendor/lix/packages/lix", default-features = false, features = ["default_wasm_runtime", "server-protocol"] }
lix_slatedb_storage = { package = "lix-storage-slatedb", path = "../vendor/lix/packages/storage-slatedb" }
object_store = { version = "0.14.0", default-features = false, features = ["aws"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["gzip-http", "http-proto", "reqwest-client", "reqwest-rustls-webpki-roots", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["experimental_trace_batch_span_processor_with_async_runtime", "rt-tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["compat", "io"] }
tower-http = { version = "0.6.8", features = ["compression-gzip", "compression-zstd", "decompression-gzip"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
async-trait = "0.1.89"
flate2 = "1.1.8"
futures-util = "0.3.31"
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
