[package]
name = "lixray"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
axum = "0.8.9"
futures-core = "0.3.32"
http = "1.4.0"
lix_engine = { git = "https://github.com/opral/lix.git", rev = "2910758b9", package = "lix_engine" }
lix_sdk = { git = "https://github.com/opral/lix.git", rev = "2910758b9", package = "lix_sdk", default-features = false }
lix_server_protocol = { git = "https://github.com/opral/lix.git", rev = "2910758b9", package = "lix_server_protocol" }
lix_slatedb_storage = { git = "https://github.com/opral/lix.git", rev = "2910758b9", package = "lix_slatedb_storage" }
object_store = { version = "0.14.0", default-features = false, features = ["aws"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = "1.23.4"

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
