[package]
name = "lixray"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
bytes = "1.11.0"
http = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
slatedb = "0.14.1"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
