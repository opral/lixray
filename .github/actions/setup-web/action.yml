name: Set up web toolchain
description: Install the shared Node, pnpm, vendored Lix cache, and native build prerequisites.

inputs:
  node-version:
    description: Node.js version
    required: true
  pnpm-version:
    description: pnpm version
    required: true

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Resolve vendored Lix revision
      id: lix-revision
      shell: bash
      run: echo "revision=$(git rev-parse HEAD:vendor/lix)" >> "$GITHUB_OUTPUT"

    - name: Cache vendored Lix SDK build
      uses: actions/cache@v4
      with:
        path: |
          vendor/lix/target
          node_modules/.cache/lix-rust-toolchain
        key: ${{ runner.os }}-${{ runner.arch }}-lix-sdk-${{ steps.lix-revision.outputs.revision }}-${{ hashFiles('scripts/prepare-vendored-lix-sdk.mjs') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-lix-sdk-

    - name: Install native build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y mold
