name: Set up web toolchain
description: Install Node and pnpm for artifact consumers.

inputs:
  node-version:
    description: Node.js version
    required: true
  pnpm-version:
    description: pnpm version
    required: true

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
