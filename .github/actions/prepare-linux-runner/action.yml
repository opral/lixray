name: Prepare Linux build runner
description: Reclaim unused SDK space only when a Docker build needs it.

inputs:
  minimum-free-gb:
    description: Minimum free GiB on the workspace and Docker filesystems
    default: "10"

runs:
  using: composite
  steps:
    - name: Ensure sufficient build space
      if: runner.environment == 'github-hosted'
      shell: bash
      env:
        MINIMUM_FREE_GB: ${{ inputs.minimum-free-gb }}
      run: bash .github/scripts/prepare-linux-runner.sh
