name: Build web image

on:
  workflow_call:
    inputs:
      infisical-identity-id:
        type: string
        required: true
      project-slug:
        type: string
        required: true
      environment:
        type: string
        default: ""
    outputs:
      image:
        description: Immutable web image built from the caller's exact checkout
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch web build configuration from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ inputs.infisical-identity-id }}
          oidc-audience: https://github.com/opral
          project-slug: ${{ inputs.project-slug }}
          env-slug: prod
          secret-path: /ci

      - name: Validate web build configuration
        id: config
        shell: bash
        run: |
          test -n "${VITE_SUPABASE_URL:-}"
          test -n "${VITE_SUPABASE_KEY:-}"
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "VITE_SUPABASE_URL must be a Supabase project URL" >&2; exit 1 ;;
          esac
          {
            echo "supabase_url=$VITE_SUPABASE_URL"
            echo "supabase_key=$VITE_SUPABASE_KEY"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Linux build runner
        uses: ./.github/actions/prepare-linux-runner

      - name: Download the prepared SDK for the Docker build
        uses: actions/download-artifact@v4
        with:
          name: vendored-lix-sdk
          path: .lixray-ci/vendored-lix-sdk

      - name: Build and push web image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web-app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lixray-web:sha-${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ steps.config.outputs.supabase_url }}
            VITE_SUPABASE_KEY=${{ steps.config.outputs.supabase_key }}
            VITE_PUBLIC_POSTHOG_TOKEN=${{ vars.VITE_PUBLIC_POSTHOG_TOKEN }}
            VITE_PUBLIC_POSTHOG_HOST=${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
            VITE_PUBLIC_TELEMETRY_ENVIRONMENT=production
            RAILWAY_GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=lixray-web-release
          # The maximal cache includes a multi-gigabyte builder layer. Uploading
          # it took 8+ minutes, longer than rebuilding the web image from scratch.
          # Keep only the final-image layers used by subsequent releases.
          cache-to: type=gha,mode=min,scope=lixray-web-release
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Resolve immutable image
        id: resolve
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lixray-web@$DIGEST" >> "$GITHUB_OUTPUT"
