name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks

      - name: Scan commits with redacted output
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # PR content must not be able to suppress findings through a local
          # config, fingerprint ignore file, or gitleaks:allow comment.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-default.toml"
          : > "$RUNNER_TEMP/gitleaks-empty.ignore"
          # Gitleaks also reads the target directory's .gitleaksignore even
          # when --gitleaks-ignore-path is explicit. A bare mirror has no
          # contributor-controlled working-tree configuration files.
          git clone --mirror --no-hardlinks . "$RUNNER_TEMP/secret-scan.git"
          # Manual runs audit every fetched ref; ordinary runs block new leaks
          # without silently allowlisting historical findings.
          log_opts="--all"
          if test "$EVENT_NAME" != workflow_dispatch &&
             test -n "$BASE_SHA" &&
             test "$BASE_SHA" != 0000000000000000000000000000000000000000; then
            git cat-file -e "$BASE_SHA^{commit}"
            git cat-file -e "$HEAD_SHA^{commit}"
            log_opts="$BASE_SHA..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git "$RUNNER_TEMP/secret-scan.git" \
            --config="$RUNNER_TEMP/gitleaks-default.toml" \
            --gitleaks-ignore-path="$RUNNER_TEMP/gitleaks-empty.ignore" \
            --ignore-gitleaks-allow \
            --log-opts="$log_opts" --redact=100 --no-banner
