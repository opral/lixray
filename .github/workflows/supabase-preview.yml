name: Supabase preview

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: supabase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  RAILWAY_PROJECT_ID: 9bf32fd3-ba84-4a40-974a-be59094761d8
  RAILWAY_WEB_SERVICE: lixray-web
  SUPABASE_PROJECT_REF: noqusbryghwsudqzccto
  SUPABASE_CLI_VERSION: 2.109.1
  RAILWAY_CLI_VERSION: 5.27.0
  PREVIEW_USER_EMAIL: preview-user@lixray.invalid

jobs:
  configure:
    name: Configure Railway preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Load preview provisioning secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 76baa70e-fdf2-4b03-9f4c-83585c3dbdf6
          oidc-audience: https://github.com/opral
          project-slug: lix-ray-0-ui-1
          env-slug: prod
          secret-path: /preview-automation

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Set up Railway CLI
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Wait for isolated Supabase branch
        id: supabase
        env:
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          branch_file="${RUNNER_TEMP}/supabase-branch.json"
          for attempt in $(seq 1 90); do
            if supabase branches get "${GIT_BRANCH}" \
              --project-ref "${SUPABASE_PROJECT_REF}" \
              --output json >"${branch_file}" 2>/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 90 ]; then
              echo "Supabase did not provision branch ${GIT_BRANCH} within 15 minutes." >&2
              exit 1
            fi
            sleep 10
          done

          supabase_url=$(jq -er '.SUPABASE_URL' "${branch_file}")
          publishable_key=$(jq -er '.SUPABASE_PUBLISHABLE_KEY // .SUPABASE_ANON_KEY' "${branch_file}")
          service_role_key=$(jq -er '.SUPABASE_SERVICE_ROLE_KEY' "${branch_file}")
          echo "::add-mask::${publishable_key}"
          echo "::add-mask::${service_role_key}"
          {
            echo "url=${supabase_url}"
            echo "publishable_key=${publishable_key}"
            echo "service_role_key=${service_role_key}"
          } >>"${GITHUB_OUTPUT}"

      - name: Generate branch-local preview password
        id: preview_user
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 32)
          echo "::add-mask::${password}"
          echo "password=${password}" >>"${GITHUB_OUTPUT}"

      - name: Seed branch-local preview user
        env:
          PREVIEW_USER_PASSWORD: ${{ steps.preview_user.outputs.password }}
          SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
        run: |
          set -euo pipefail
          users_file="${RUNNER_TEMP}/supabase-users.json"
          curl --fail --silent --show-error \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/auth/v1/admin/users?page=1&per_page=1000" \
            >"${users_file}"
          user_id=$(jq -r --arg email "${PREVIEW_USER_EMAIL}" \
            '.users[]? | select(.email == $email) | .id' "${users_file}" | head -n 1)
          user_body=$(jq -cn \
            --arg email "${PREVIEW_USER_EMAIL}" \
            --arg password "${PREVIEW_USER_PASSWORD}" \
            '{email:$email,password:$password,email_confirm:true,user_metadata:{full_name:"Preview user"}}')
          if [ -n "${user_id}" ]; then
            curl --fail --silent --show-error \
              --request PUT \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --data "${user_body}" \
              "${SUPABASE_URL}/auth/v1/admin/users/${user_id}" >/dev/null
          else
            curl --fail --silent --show-error \
              --request POST \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --data "${user_body}" \
              "${SUPABASE_URL}/auth/v1/admin/users" >/dev/null
          fi

      - name: Wait for Railway PR environment
        env:
          RAILWAY_ENVIRONMENT: lixray-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if railway variable list \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT}" \
              --service "${RAILWAY_WEB_SERVICE}" \
              --json >/dev/null 2>&1; then
              exit 0
            fi
            if [ "${attempt}" -eq 90 ]; then
              echo "Railway did not provision ${RAILWAY_ENVIRONMENT} within 15 minutes." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Point Railway at the Supabase branch
        env:
          RAILWAY_ENVIRONMENT: lixray-pr-${{ github.event.pull_request.number }}
          PREVIEW_USER_PASSWORD: ${{ steps.preview_user.outputs.password }}
          SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
        run: |
          set -euo pipefail
          railway variable set \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_WEB_SERVICE}" \
            --skip-deploys \
            "VITE_SUPABASE_URL=${SUPABASE_URL}" \
            "VITE_SUPABASE_KEY=${SUPABASE_PUBLISHABLE_KEY}" \
            "SUPABASE_URL=${SUPABASE_URL}" \
            "SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}" \
            "SUPABASE_JWKS_URL=${SUPABASE_URL}/auth/v1/.well-known/jwks.json" \
            "SUPABASE_JWT_ISSUER_URL=${SUPABASE_URL}" \
            "VITE_LIXRAY_LOCAL_DEV=1" \
            "VITE_LIXRAY_LOCAL_DEV_EMAIL=${PREVIEW_USER_EMAIL}" \
            "VITE_LIXRAY_LOCAL_DEV_PASSWORD=${PREVIEW_USER_PASSWORD}" \
            "VITE_PUBLIC_TELEMETRY_ENVIRONMENT=preview"

          railway redeploy \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_WEB_SERVICE}" \
            --from-source \
            --yes
