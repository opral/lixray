name: Prepare Lix server image

on:
  workflow_call:
    secrets:
      LIX_ACTIONS_READ_TOKEN:
        required: false
    outputs:
      image:
        value: ${{ jobs.resolve.outputs.image }}
      source:
        value: ${{ jobs.resolve.outputs.source }}
      source_revision:
        value: ${{ jobs.resolve.outputs.source_revision }}

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    name: Reuse tested server image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      source: ${{ steps.resolve.outputs.source }}
      source_revision: ${{ steps.resolve.outputs.sourceRevision }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up artifact resolver
        uses: ./.github/actions/setup-web
        with:
          node-version: "24"
          pnpm-version: "10.13.1"

      - name: Install only artifact resolver dependencies
        run: pnpm install --filter lixray-repository --frozen-lockfile --ignore-scripts

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve tested server image
        id: resolve
        env:
          LIX_CI_ARTIFACT_GITHUB_TOKEN: ${{ secrets.LIX_ACTIONS_READ_TOKEN || github.token }}
          LIXRAY_LIX_ARTIFACTS: "only"
          LIXRAY_ALLOW_SOURCE_BUILD: "false"
        run: node .github/scripts/resolve-lix-server-image.mjs

      - name: Require the pinned server artifact
        if: steps.resolve.outputs.image == ''
        run: |
          echo "::error::Pinned server artifact is missing. Build it in https://github.com/opral/lix/actions/workflows/ci.yml using the artifact-only action, then retry."
          exit 1
