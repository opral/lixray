name: Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Resolve tested images
    # Cache hits still only inspect and retag. A miss builds the missing
    # content tag so interleaved merges cannot leave main red. PR CI already
    # uses this runner; 5 minutes on ubuntu-latest cannot finish a real build.
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 50
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      server: ${{ steps.resolve.outputs.server }}
      web: ${{ steps.resolve.outputs.web }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch web build configuration from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          oidc-audience: https://github.com/opral
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci

      - name: Validate web build configuration
        id: config
        shell: bash
        run: |
          test -n "${VITE_SUPABASE_URL:-}"
          test -n "${VITE_SUPABASE_KEY:-}"
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "VITE_SUPABASE_URL must be a Supabase project URL" >&2; exit 1 ;;
          esac
          {
            echo "supabase_url=$VITE_SUPABASE_URL"
            echo "supabase_key=$VITE_SUPABASE_KEY"
          } >> "$GITHUB_OUTPUT"

      - name: Compute content-addressed web image name
        id: identity
        shell: bash
        env:
          POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
          POSTHOG_TOKEN: ${{ vars.VITE_PUBLIC_POSTHOG_TOKEN }}
          SUPABASE_URL: ${{ steps.config.outputs.supabase_url }}
          SUPABASE_KEY: ${{ steps.config.outputs.supabase_key }}
        run: |
          # Keep these inputs identical to .github/workflows/pr.yml.
          tree="$(git rev-parse 'HEAD^{tree}')"
          web_inputs="$(
            {
              git ls-tree HEAD -- \
                .dockerignore \
                .gitmodules \
                package.json \
                pnpm-lock.yaml \
                pnpm-workspace.yaml \
                vendor/atelier \
                vendor/lix
              git ls-tree -r HEAD -- scripts web-app
              printf 'posthog-host=%s\nposthog-token=%s\nsupabase-url=%s\nsupabase-key=%s\n' \
                "$POSTHOG_HOST" "$POSTHOG_TOKEN" "$SUPABASE_URL" "$SUPABASE_KEY"
            } | git hash-object --stdin
          )"
          web_repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lixray-web"
          {
            echo "tree=$tree"
            echo "web_repository=$web_repository"
            echo "web_content_tag=$web_repository:web-$web_inputs"
            echo "web_tree_tag=$web_repository:tree-$tree"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve tested Lix server image
        id: server
        env:
          LIX_CI_ARTIFACT_GITHUB_TOKEN: ${{ secrets.LIX_ACTIONS_READ_TOKEN || github.token }}
          LIX_CI_ARTIFACT_WAIT_SECONDS: "900"
        run: node .github/scripts/resolve-lix-server-image.mjs

      - name: Check for existing web image
        id: existing
        shell: bash
        env:
          WEB_CONTENT_TAG: ${{ steps.identity.outputs.web_content_tag }}
        run: |
          inspect_digest() {
            docker buildx imagetools inspect "$1" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null |
              tr -d '"'
          }

          if digest="$(inspect_digest "$WEB_CONTENT_TAG")" && test -n "$digest"; then
            echo "web_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "web_found=true" >> "$GITHUB_OUTPUT"
            echo "Reusing published web image $WEB_CONTENT_TAG"
          else
            echo "web_found=false" >> "$GITHUB_OUTPUT"
            echo "Web content tag $WEB_CONTENT_TAG is missing; building it."
          fi

      - name: Build and push web image
        id: build-web
        if: steps.existing.outputs.web_found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web-app/Dockerfile
          push: true
          tags: |
            ${{ steps.identity.outputs.web_content_tag }}
            ${{ steps.identity.outputs.web_tree_tag }}
          build-args: |
            VITE_SUPABASE_URL=${{ steps.config.outputs.supabase_url }}
            VITE_SUPABASE_KEY=${{ steps.config.outputs.supabase_key }}
            VITE_PUBLIC_POSTHOG_TOKEN=${{ vars.VITE_PUBLIC_POSTHOG_TOKEN }}
            VITE_PUBLIC_POSTHOG_HOST=${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
            VITE_PUBLIC_TELEMETRY_ENVIRONMENT=production
            RAILWAY_GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=lixray-web-release
          # The maximal cache includes a multi-gigabyte builder layer. Uploading
          # it took 8+ minutes, longer than rebuilding the web image from scratch.
          # Keep only the final-image layers used by subsequent releases.
          cache-to: type=gha,mode=min,scope=lixray-web-release
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Resolve immutable images
        id: resolve
        shell: bash
        env:
          WEB_BUILT_DIGEST: ${{ steps.build-web.outputs.digest }}
          WEB_EXISTING_DIGEST: ${{ steps.existing.outputs.web_digest }}
          WEB_REPOSITORY: ${{ steps.identity.outputs.web_repository }}
          SERVER_IMAGE: ${{ steps.server.outputs.image }}
        run: |
          web_digest="${WEB_BUILT_DIGEST:-$WEB_EXISTING_DIGEST}"
          test -n "$web_digest"
          test -n "$SERVER_IMAGE"
          docker manifest inspect "$SERVER_IMAGE" >/dev/null
          echo "server=$SERVER_IMAGE" >> "$GITHUB_OUTPUT"
          echo "web=$WEB_REPOSITORY@$web_digest" >> "$GITHUB_OUTPUT"
          echo "Resolved server image: $SERVER_IMAGE"
          echo "Resolved web image: $WEB_REPOSITORY@$web_digest"

      - name: Publish main aliases without rebuilding
        shell: bash
        env:
          WEB_IMAGE: ${{ steps.resolve.outputs.web }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lixray-web:main" \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lixray-web:sha-${GITHUB_SHA}" \
            "$WEB_IMAGE"

  database:
    name: Apply database migrations
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Validate production configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link production project
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Preview production migrations
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --dry-run

      - name: Apply production migrations
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked

      - name: Confirm production has no pending migrations
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --dry-run

  release:
    name: Promote production release
    needs:
      - database
      - images
    runs-on: ubuntu-latest
    # Promotion can legitimately include the canary waiting through one
    # bounded, server-owned repository migration.
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release coordinator
        uses: actions/checkout@v4

      - name: Validate Infisical configuration
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
        run: |
          test -n "$INFISICAL_IDENTITY_ID"
          test -n "$INFISICAL_PROJECT_SLUG"

      - name: Fetch deployment secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          oidc-audience: https://github.com/opral
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci

      - name: Validate deployment credentials
        run: |
          test -n "$RAILWAY_API_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_PRODUCTION_ENVIRONMENT"
          test -n "$RAILWAY_SERVER_SERVICE"
          test -n "$RAILWAY_WEB_SERVICE"
          test -n "$GHCR_READ_USERNAME"
          test -n "$GHCR_READ_TOKEN"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Railway CLI
        run: npm install --global @railway/cli@5.30.1

      - name: Promote web and server images
        shell: bash
        env:
          SERVER_IMAGE: ${{ needs.images.outputs.server }}
          WEB_IMAGE: ${{ needs.images.outputs.web }}
        run: .github/scripts/promote-production.sh

      - name: Check public production repository canary
        env:
          LIXRAY_CANARY_LIX_URL: ${{ vars.LIXRAY_CANARY_LIX_URL }}
        run: node scripts/check-production-lix.mjs
