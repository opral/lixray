name: Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  server-image:
    if: github.ref == 'refs/heads/main'
    name: Lix server image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/lix-server-image.yml
    secrets: inherit

  sdk:
    if: github.ref == 'refs/heads/main'
    name: Vendored Lix SDK
    uses: ./.github/workflows/lix-sdk.yml
    secrets: inherit

  web-image:
    name: Build production web image
    needs: sdk
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/web-image.yml
    with:
      infisical-identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
      project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
      environment: production
    secrets: inherit

  validate:
    name: Validate production candidate
    needs:
      - web-image
      - server-image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/browser-integration.yml
    with:
      web-image: ${{ needs.web-image.outputs.image }}
      server-image: ${{ needs.server-image.outputs.image }}

  # Promote main only after the matching web/server images pass validation.
  database:
    if: github.ref == 'refs/heads/main'
    name: Apply database migrations
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # 2.112.0 rejects the Management API's timestamps during `link`
          # (supabase/cli#6115); fixed in 2.113.0.
          version: 2.113.0

      - name: Validate production configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link production project
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Preview production migrations
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --dry-run

      - name: Apply production migrations
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked

      - name: Confirm production has no pending migrations
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --dry-run

  release:
    if: github.ref == 'refs/heads/main'
    name: Promote production release
    needs:
      - database
      - validate
      - web-image
      - server-image
    runs-on: ubuntu-latest
    # Future storage-format cutovers require offline migration before promotion.
    # Ordinary serving hosts never migrate repositories.
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release coordinator
        uses: actions/checkout@v4

      - name: Validate Infisical configuration
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
        run: |
          test -n "$INFISICAL_IDENTITY_ID"
          test -n "$INFISICAL_PROJECT_SLUG"

      - name: Fetch deployment secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          oidc-audience: https://github.com/opral
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci

      - name: Validate deployment credentials
        run: |
          test -n "$RAILWAY_API_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_PRODUCTION_ENVIRONMENT"
          test -n "$RAILWAY_SERVER_SERVICE"
          test -n "$RAILWAY_WEB_SERVICE"
          test -n "$GHCR_READ_USERNAME"
          test -n "$GHCR_READ_TOKEN"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Railway CLI
        run: npm install --global @railway/cli@5.30.1

      - name: Promote web and server images
        shell: bash
        env:
          SERVER_IMAGE: ${{ needs.server-image.outputs.image }}
          WEB_IMAGE: ${{ needs.web-image.outputs.image }}
        run: .github/scripts/promote-production.sh

      - name: Adopt existing production canary storage
        env:
          LIXRAY_CANARY_LIX_URL: ${{ vars.LIXRAY_CANARY_LIX_URL }}
        run: node .github/scripts/provision-production-canary.mjs

      - name: Check public production repository canary
        env:
          LIXRAY_CANARY_LIX_URL: ${{ vars.LIXRAY_CANARY_LIX_URL }}
        run: node scripts/check-production-lix.mjs
