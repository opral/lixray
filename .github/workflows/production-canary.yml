name: Production Lix canary

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-lix-canary
  cancel-in-progress: false

jobs:
  check:
    name: Open and read production Lix
    runs-on: ubuntu-latest
    # A repository format migration is an explicit, retryable server state.
    # Leave enough time for the canary's bounded migration poll to complete.
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check public canary repository
        env:
          LIXRAY_CANARY_LIX_URL: ${{ vars.LIXRAY_CANARY_LIX_URL }}
        run: node scripts/check-production-lix.mjs
