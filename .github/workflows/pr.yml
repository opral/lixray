name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests should converge on the newest commit. Production pushes must
  # finish in order so a newer merge cannot cancel a migration in flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # keep aligned with config.toml
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_PROFILE_BENCH_DEBUG: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  DEBIAN_FRONTEND: noninteractive
  BINSTALL_NO_CONFIRM: true

  NODE_VERSION: "22"
  PNPM_VERSION: "10.13.1"

jobs:
  server-image:
    name: Server image
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      tree: ${{ steps.identity.outputs.tree }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute content-addressed image name
        id: identity
        shell: bash
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lixray-server"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "tag=$repository:tree-$tree" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for an existing image
        id: existing
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          if digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')" && test -n "$digest"; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push server image
        id: build
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lix-server/Dockerfile
          push: true
          tags: ${{ steps.identity.outputs.tag }}
          build-args: |
            CARGO_BUILD_JOBS=32
          cache-from: type=gha,scope=lix-server-release
          cache-to: type=gha,mode=max,scope=lix-server-release
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Resolve immutable image
        id: resolve
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          REPOSITORY: ${{ steps.identity.outputs.repository }}
        run: |
          digest="${BUILT_DIGEST:-$EXISTING_DIGEST}"
          test -n "$digest"
          echo "image=$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
          echo "Using $REPOSITORY@$digest"

      - name: Publish main aliases without rebuilding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          REPOSITORY: ${{ steps.identity.outputs.repository }}
        run: |
          docker buildx imagetools create \
            --tag "$REPOSITORY:main" \
            --tag "$REPOSITORY:sha-${GITHUB_SHA}" \
            "$IMAGE"

  frontend:
    name: Frontend
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache vendored Lix SDK build
        uses: actions/cache@v4
        with:
          path: |
            vendor/lix/target
            node_modules/.cache/lix-rust-toolchain
          key: ${{ runner.os }}-${{ runner.arch }}-lix-sdk-${{ hashFiles('vendor/lix/Cargo.lock', 'vendor/lix/rust-toolchain.toml', 'vendor/lix/packages/js-sdk/**', 'scripts/prepare-vendored-lix-sdk.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lix-sdk-

      - name: Validate Docker submodule fallbacks
        run: pnpm check:docker-submodule-pins --verify-archives

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test performance harness
        run: pnpm perf:test

      - name: Check formatting
        run: pnpm --dir web-app format:check

      - name: Lint
        run: pnpm --dir web-app lint

      - name: Typecheck and test frontend
        run: pnpm --dir web-app check:cloudflare

      - name: Build frontend
        run: pnpm --dir web-app build

      - name: Build Railway target
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_KEY: ci-public-placeholder
        run: pnpm --dir web-app build:node

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Validate submodule branches
        run: |
          git submodule foreach '
            branch=$(git config -f "$toplevel/.gitmodules" "submodule.$name.branch" || :)
            test -z "$branch" && exit 0

            if test "$(git rev-parse --is-shallow-repository)" = "true"; then
              git fetch --no-tags --unshallow origin "refs/heads/$branch"
            else
              git fetch --no-tags origin "refs/heads/$branch"
            fi

            git merge-base --is-ancestor "$sha1" FETCH_HEAD || {
              echo "$sm_path: $sha1 is not reachable from origin/$branch"
              exit 1
            }
          '

  database:
    name: Database
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Test database policies and functions
        working-directory: database
        run: |
          supabase start --exclude edge-runtime,gotrue,imgproxy,kong,logflare,mailpit,postgres-meta,postgrest,realtime,storage-api,studio,supavisor,vector
          supabase test db

  rust:
    name: Rust
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-21
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lix-server

      - name: Check Rust
        run: |
          cargo -Z bindeps fmt --manifest-path lix-server/Cargo.toml --check
          cargo clippy --manifest-path lix-server/Cargo.toml -Z bindeps --locked --all-targets --all-features -- -D warnings
          cargo -Z bindeps test --manifest-path lix-server/Cargo.toml --locked

  e2e:
    name: E2E
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Cache vendored Lix SDK build
        uses: actions/cache@v4
        with:
          path: |
            vendor/lix/target
            node_modules/.cache/lix-rust-toolchain
          key: ${{ runner.os }}-${{ runner.arch }}-lix-sdk-${{ hashFiles('vendor/lix/Cargo.lock', 'vendor/lix/rust-toolchain.toml', 'vendor/lix/packages/js-sdk/**', 'scripts/prepare-vendored-lix-sdk.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lix-sdk-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir web-app exec playwright install --with-deps chromium

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the content-addressed server image
        id: server-image
        shell: bash
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lixray-server"
          tag="$repository:tree-$tree"

          for attempt in $(seq 1 75); do
            if digest="$(
              docker buildx imagetools inspect "$tag" \
                --format '{{json .Manifest.Digest}}' 2>/dev/null |
                tr -d '"'
            )" && test -n "$digest"; then
              image="$repository@$digest"
              docker pull "$image"
              echo "image=$image" >> "$GITHUB_OUTPUT"
              echo "Testing $image"
              exit 0
            fi
            echo "Waiting for server image $tag ($attempt/75)"
            sleep 10
          done

          echo "Server image $tag was not published within 12.5 minutes." >&2
          exit 1

      - name: Run Compose e2e tests
        env:
          LIXRAY_SERVER_IMAGE: ${{ steps.server-image.outputs.image }}
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: web-app/test-results
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs:
      - frontend
      - database
      - rust
      - e2e
      - server-image
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Confirm all CI lanes passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: echo "All CI lanes passed"

      - name: Fail for an unsuccessful CI lane
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

  deploy-database:
    name: Deploy production database
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Validate production configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link production project
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Preview production migrations
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --dry-run

      - name: Apply production migrations
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked

      - name: Confirm production has no pending migrations
        working-directory: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --dry-run

  deploy-server-preview:
    name: Deploy server preview
    if: github.event_name == 'pull_request'
    needs:
      - ci
      - server-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check Infisical configuration
        id: infisical
        shell: bash
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_PREVIEW_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
        run: |
          if test -n "$INFISICAL_IDENTITY_ID" &&
             test -n "$INFISICAL_PROJECT_SLUG"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping Railway preview promotion; configure the Infisical Actions variables documented in README.md."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch deployment secrets from Infisical
        if: steps.infisical.outputs.available == 'true'
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PREVIEW_IDENTITY_ID }}
          oidc-audience: https://github.com/opral
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci

      - name: Check deployment credentials
        if: steps.infisical.outputs.available == 'true'
        id: credentials
        shell: bash
        run: |
          test -n "$RAILWAY_API_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_PRODUCTION_ENVIRONMENT"
          test -n "$RAILWAY_SERVER_SERVICE"
          test -n "$GHCR_READ_USERNAME"
          test -n "$GHCR_READ_TOKEN"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Set up Railway CLI
        if: steps.credentials.outputs.available == 'true'
        run: npm install --global @railway/cli@4.65.0

      - name: Find Railway PR environment
        if: steps.credentials.outputs.available == 'true'
        id: environment
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_PRODUCTION_ENVIRONMENT"
          for attempt in $(seq 1 30); do
            environment_id="$(
              railway environment list --ephemeral --json |
                jq -r --argjson pr "$PR_NUMBER" \
                  '.environments[] | select(.meta.prNumber == $pr) | .id' |
                head -n 1
            )"
            if test -n "$environment_id"; then
              echo "id=$environment_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Railway did not create an environment for PR #$PR_NUMBER within 5 minutes." >&2
          exit 1

      - name: Promote tested image to preview
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        env:
          IMAGE: ${{ needs.server-image.outputs.image }}
          ENVIRONMENT_ID: ${{ steps.environment.outputs.id }}
        run: |
          previous_deployment="$(
            railway deployment list \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$ENVIRONMENT_ID" \
              --service "$RAILWAY_SERVER_SERVICE" \
              --limit 1 \
              --json |
              jq -r '.[0].id // empty'
          )"
          railway environment edit \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$ENVIRONMENT_ID" \
            --message "Deploy tested server image for PR #${{ github.event.pull_request.number }}" \
            --service-config "$RAILWAY_SERVER_SERVICE" source.image "$IMAGE" \
            --service-config "$RAILWAY_SERVER_SERVICE" source.repo null \
            --service-config "$RAILWAY_SERVER_SERVICE" source.branch null \
            --service-config "$RAILWAY_SERVER_SERVICE" deploy.registryCredentials.username "$GHCR_READ_USERNAME" \
            --service-config "$RAILWAY_SERVER_SERVICE" deploy.registryCredentials.password "$GHCR_READ_TOKEN"
          for attempt in $(seq 1 30); do
            deployment="$(
              railway deployment list \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "$ENVIRONMENT_ID" \
                --service "$RAILWAY_SERVER_SERVICE" \
                --limit 1 \
                --json
            )"
            deployment_id="$(jq -r '.[0].id // empty' <<<"$deployment")"
            status="$(jq -r '.[0].status // empty' <<<"$deployment")"
            if test -n "$deployment_id" && test "$deployment_id" != "$previous_deployment"; then
              case "$status" in
                SUCCESS)
                  echo "Railway preview is running $IMAGE"
                  exit 0
                  ;;
                FAILED|CRASHED|REMOVED)
                  echo "Railway preview deployment $deployment_id ended with $status." >&2
                  exit 1
                  ;;
              esac
            fi
            sleep 10
          done
          echo "Railway preview did not become healthy within 5 minutes." >&2
          exit 1

  deploy-server-production:
    name: Deploy server production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - ci
      - deploy-database
      - server-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check Infisical configuration
        id: infisical
        shell: bash
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
        run: |
          if test -n "$INFISICAL_IDENTITY_ID" &&
             test -n "$INFISICAL_PROJECT_SLUG"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping Railway production promotion; configure the Infisical Actions variables documented in README.md."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch deployment secrets from Infisical
        if: steps.infisical.outputs.available == 'true'
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          oidc-audience: https://github.com/opral
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci

      - name: Check deployment credentials
        if: steps.infisical.outputs.available == 'true'
        id: credentials
        shell: bash
        run: |
          test -n "$RAILWAY_API_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_PRODUCTION_ENVIRONMENT"
          test -n "$RAILWAY_SERVER_SERVICE"
          test -n "$GHCR_READ_USERNAME"
          test -n "$GHCR_READ_TOKEN"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Set up Railway CLI
        if: steps.credentials.outputs.available == 'true'
        run: npm install --global @railway/cli@4.65.0

      - name: Promote tested image to production
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        env:
          IMAGE: ${{ needs.server-image.outputs.image }}
        run: |
          previous_deployment="$(
            railway deployment list \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_PRODUCTION_ENVIRONMENT" \
              --service "$RAILWAY_SERVER_SERVICE" \
              --limit 1 \
              --json |
              jq -r '.[0].id // empty'
          )"
          railway environment edit \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_PRODUCTION_ENVIRONMENT" \
            --message "Deploy tested server image for ${GITHUB_SHA}" \
            --service-config "$RAILWAY_SERVER_SERVICE" source.image "$IMAGE" \
            --service-config "$RAILWAY_SERVER_SERVICE" source.repo null \
            --service-config "$RAILWAY_SERVER_SERVICE" source.branch null \
            --service-config "$RAILWAY_SERVER_SERVICE" deploy.registryCredentials.username "$GHCR_READ_USERNAME" \
            --service-config "$RAILWAY_SERVER_SERVICE" deploy.registryCredentials.password "$GHCR_READ_TOKEN"
          for attempt in $(seq 1 30); do
            deployment="$(
              railway deployment list \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "$RAILWAY_PRODUCTION_ENVIRONMENT" \
                --service "$RAILWAY_SERVER_SERVICE" \
                --limit 1 \
                --json
            )"
            deployment_id="$(jq -r '.[0].id // empty' <<<"$deployment")"
            status="$(jq -r '.[0].status // empty' <<<"$deployment")"
            if test -n "$deployment_id" && test "$deployment_id" != "$previous_deployment"; then
              case "$status" in
                SUCCESS)
                  echo "Railway production is running $IMAGE"
                  exit 0
                  ;;
                FAILED|CRASHED|REMOVED)
                  echo "Railway production deployment $deployment_id ended with $status." >&2
                  exit 1
                  ;;
              esac
            fi
            sleep 10
          done
          echo "Railway production did not become healthy within 5 minutes." >&2
          exit 1
