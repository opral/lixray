name: PR checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # keep aligned with config.toml
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_PROFILE_BENCH_DEBUG: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # NODE_ENV: production
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  DEBIAN_FRONTEND: noninteractive
  BINSTALL_NO_CONFIRM: true

  NODE_VERSION: "22"
  PNPM_VERSION: "10.13.1"

jobs:
  database:
    name: Supabase database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start Supabase
        working-directory: database
        run: supabase start

      - name: Test database policies and functions
        working-directory: database
        run: supabase test db

  frontend:
    name: Frontend checks
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm --dir web-app format:check

      - name: Lint
        run: pnpm --dir web-app lint

      - name: Typecheck and worker tests
        run: pnpm --dir web-app check:cloudflare

      - name: Build
        run: pnpm --dir web-app build

      - name: Verify generated files are committed
        run: git diff --exit-code

  rust:
    name: Rust checks
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lix-server

      - name: Check formatting
        run: cargo fmt --manifest-path lix-server/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path lix-server/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path lix-server/Cargo.toml --locked

  e2e:
    name: End-to-end tests
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir web-app exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --dir web-app test:e2e

  preview:
    name: Deploy PR preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action)
    needs: [frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview Worker
        id: build
        continue-on-error: true
        run: |
          pnpm --dir web-app build:preview
          pnpm --dir web-app exec node scripts/verify-preview-bundle.mjs

      - name: Upload version and move PR alias
        id: upload
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: web-app
        env:
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          NO_COLOR=1 pnpm exec wrangler versions upload \
            --config ./dist/server/wrangler.json \
            --preview-alias "$PREVIEW_ALIAS" | tee /tmp/lixray-preview-upload.txt
          preview_url=$(grep -Eo 'https://[^[:space:]]+' /tmp/lixray-preview-upload.txt | grep "$PREVIEW_ALIAS-lixray-preview" | tail -1 | sed 's/[[:punct:]]$//')
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test preview API
        id: api-smoke
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        run: node web-app/scripts/smoke-preview.mjs "${{ steps.upload.outputs.url }}"

      - name: Install Playwright browser
        if: steps.upload.outcome == 'success'
        run: pnpm --dir web-app exec playwright install --with-deps chromium

      - name: Smoke-test preview editor
        id: browser-smoke
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.upload.outputs.url }}
        run: >-
          pnpm --dir web-app exec playwright test tests/e2e/runtime.spec.ts
          --grep "home lists workspaces and opens the canonical workspace route"

      - name: Update preview comment
        if: always()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          UPLOAD_STATUS: ${{ steps.upload.outcome }}
          API_STATUS: ${{ steps.api-smoke.outcome }}
          BROWSER_STATUS: ${{ steps.browser-smoke.outcome }}
        with:
          script: |
            const marker = '<!-- lixray-preview -->'
            const successful = [
              process.env.BUILD_STATUS,
              process.env.UPLOAD_STATUS,
              process.env.API_STATUS,
              process.env.BROWSER_STATUS,
            ].every((status) => status === 'success')
            const status = successful ? '✅ Ready' : '❌ Deployment failed'
            const url = process.env.PREVIEW_URL
            const body = [
              marker,
              `### Lixray Worker preview — ${status}`,
              '',
              url ? `[Open preview](${url})` : 'No preview URL was produced.',
              '',
              `Commit: \`${context.payload.pull_request.head.sha}\``,
              `Checks: build ${process.env.BUILD_STATUS}, upload ${process.env.UPLOAD_STATUS}, API ${process.env.API_STATUS}, editor ${process.env.BROWSER_STATUS}`,
              `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_Preview data is isolate-local and may disappear at any time._',
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Fail when preview deployment is not ready
        if: >-
          always() &&
          (steps.build.outcome != 'success' ||
          steps.upload.outcome != 'success' ||
          steps.api-smoke.outcome != 'success' ||
          steps.browser-smoke.outcome != 'success')
        run: exit 1
