name: PR checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # keep aligned with config.toml
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_PROFILE_BENCH_DEBUG: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # NODE_ENV: production
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  DEBIAN_FRONTEND: noninteractive
  BINSTALL_NO_CONFIRM: true

  NODE_VERSION: "22"
  PNPM_VERSION: "10.13.1"

jobs:
  database:
    name: Supabase database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start Supabase
        working-directory: database
        run: supabase start

      - name: Test database policies and functions
        working-directory: database
        run: supabase test db

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate Docker submodule fallbacks
        run: pnpm check:docker-submodule-pins --verify-archives

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm --dir web-app format:check

      - name: Lint
        run: pnpm --dir web-app lint

      - name: Typecheck and worker tests
        run: pnpm --dir web-app check:cloudflare

      - name: Build
        run: pnpm --dir web-app build

      - name: Build Railway target
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_KEY: ci-public-placeholder
        run: pnpm --dir web-app build:node

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Validate submodule branches
        run: |
          git submodule foreach '
            branch=$(git config -f "$toplevel/.gitmodules" "submodule.$name.branch" || :)
            test -z "$branch" && exit 0

            if test "$(git rev-parse --is-shallow-repository)" = "true"; then
              git fetch --no-tags --unshallow origin "refs/heads/$branch"
            else
              git fetch --no-tags origin "refs/heads/$branch"
            fi

            git merge-base --is-ancestor "$sha1" FETCH_HEAD || {
              echo "$sm_path: $sha1 is not reachable from origin/$branch"
              exit 1
            }
          '

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lix-server

      - name: Check formatting
        run: cargo fmt --manifest-path lix-server/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path lix-server/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path lix-server/Cargo.toml --locked

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir web-app exec playwright install --with-deps chromium

      - name: Run Compose e2e tests
        run: pnpm test:e2e
