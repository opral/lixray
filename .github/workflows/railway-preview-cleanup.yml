name: Cleanup Railway preview

on:
  pull_request:
    types:
      - closed

concurrency:
  group: railway-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    name: Delete preview environment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out cleanup coordinator
        uses: actions/checkout@v4

      - name: Fetch deployment secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PREVIEW_IDENTITY_ID }}
          oidc-audience: https://github.com/opral
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci

      - name: Delete CI-managed Railway preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/manage-railway-preview.sh delete
