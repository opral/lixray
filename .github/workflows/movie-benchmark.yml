name: Remote 1 TiB movie benchmark

on:
  workflow_dispatch:
    inputs:
      segment-index:
        description: Zero-based byte-balanced segment
        required: true
        type: number
      segment-count:
        description: Total sequential segments
        required: true
        default: 4
        type: number
      lix-id:
        description: UUID of the fresh Lix shared by all sequential segments
        required: true
        type: string
      finalize-history:
        description: Verify all files and extend history to exactly 5,000 commits
        required: true
        default: false
        type: boolean

concurrency:
  group: remote-movie-${{ inputs.lix-id }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  qualify:
    name: Segment ${{ inputs.segment-index }} of ${{ inputs.segment-count }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 360
    environment: production

    steps:
      - name: Check out qualification revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch deployment credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          oidc-audience: https://github.com/opral
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci

      - name: Set up Railway CLI
        run: npm install --global @railway/cli@5.30.1

      - name: Resolve production target without exposing credentials
        id: target
        shell: bash
        env:
          ALLOWED_LIX_ID: ${{ vars.MOVIE_BENCHMARK_LIX_ID }}
          REQUESTED_LIX_ID: ${{ inputs.lix-id }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [[ ! "$REQUESTED_LIX_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "lix-id must be a canonical lowercase UUID" >&2
            exit 2
          fi
          if [[ ! "$ALLOWED_LIX_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "the production environment must configure MOVIE_BENCHMARK_LIX_ID" >&2
            exit 2
          fi
          if [[ "$REQUESTED_LIX_ID" != "$ALLOWED_LIX_ID" ]]; then
            echo "lix-id is not the allowlisted production movie benchmark Lix" >&2
            exit 2
          fi
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          lix_lookup="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$(jq -cn \
                --arg query "select exists (select 1 from public.lixes where id = '$REQUESTED_LIX_ID'::uuid and deleted_at is null) as exists" \
                '{query: $query}'
              )"
          )"
          if ! jq -e 'length == 1 and .[0].exists == true' <<<"$lix_lookup" >/dev/null; then
            echo "lix-id does not identify an existing production Lix" >&2
            exit 2
          fi
          variables="$(
            railway variables \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_PRODUCTION_ENVIRONMENT" \
              --service "$RAILWAY_SERVER_SERVICE" \
              --json
          )"
          internal_token="$(jq -r '.LIXRAY_INTERNAL_TOKEN // empty' <<<"$variables")"
          public_domain="$(jq -r '.RAILWAY_PUBLIC_DOMAIN // empty' <<<"$variables")"
          test -n "$internal_token"
          test -n "$public_domain"
          echo "::add-mask::$internal_token"
          echo "LIXRAY_INTERNAL_TOKEN=$internal_token" >> "$GITHUB_ENV"
          echo "base-url=https://$public_domain" >> "$GITHUB_OUTPUT"
          echo "lix-id=$REQUESTED_LIX_ID" >> "$GITHUB_OUTPUT"

      - name: Promote the exact tested server image
        shell: bash
        env:
          IMAGE: ghcr.io/opral/lix-server@sha256:5d59180190b2a891be77adf201e4405c4d514eb6ba4a86dd94d12c3f468b4807
        run: .github/scripts/promote-benchmark-server.sh

      - name: Materialize and verify segment
        shell: bash
        run: |
          node perf/movie/remote-qualification.mjs \
            --url '${{ steps.target.outputs.base-url }}' \
            --repository '${{ steps.target.outputs.lix-id }}' \
            --segment-index '${{ inputs.segment-index }}' \
            --segment-count '${{ inputs.segment-count }}' \
            --finalize-history '${{ inputs.finalize-history }}' \
            --output 'perf/results/movie-segment-${{ inputs.segment-index }}.json'

      - name: Upload qualification report
        uses: actions/upload-artifact@v4
        with:
          name: movie-${{ steps.target.outputs.lix-id }}-segment-${{ inputs.segment-index }}
          path: perf/results/movie-segment-${{ inputs.segment-index }}.json
          if-no-files-found: error
          retention-days: 30
